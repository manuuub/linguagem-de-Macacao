<!DOCTYPE html>
<html lang = "pt-br">
	<head>
		<meta charset= "UTF-8">
		<title>Exercicio1</title>
	</head>
	<body>
	
	<!--table -> tabela-->
		<!--Inicio tabela-->
		<table border= "1" width="100%">
			<!--thead -> table head -> cabeçalho da tabela -->
			<thead>
				<!--Criando a primeira linha -->
				<!--linha da tabela ->table row -> tr -->
				<tr style = "background-color: green ; color: #000000 ;">
					<!-- th -> table head -> cabeçalho -->
					<th colspan="5">Tabela de Serviços Mecânicos</th>
				</tr>
			</thead>
			<!--tbody -> table body -> corpo da tabela -->
			<tbody>
			
				<tr>
					<!-- th -> table head -> cabeçalho -->
					<th rowspan="5 ;background-color: #4682B4 ">Nacionais</th>
					<th style = "background-color: #D3D3D3 ; color: #000000 ;">Veículos</th>
					<th style = "background-color: #D3D3D3 ; color: #000000 ;">Serviço</th>
					<th style = "background-color: #D3D3D3 ; color: #000000 ;">Tempo Previsto</th>
					<th style = "background-color: #D3D3D3 ; color: #000000 ;">Valor</th>
				</tr>
				
				<!--Criando a segunda linha  -->
				<!--linha da tabela ->table row -> tr -->
				<tr>
					<!--td -> table data -> dados tabela -->
					<td>Caminhonete S10</td>
					<td> Suspensão </td>
					<td> 3 horas e 25 minutos</td>
					<td> 350,00</td>
				</tr>
				<!--Criando a terceira linha  -->
				<!--linha da tabela ->table row -> tr -->
				<tr>
					<td>Caminhonete Ranger</td>
					<td> Freio </td>
					<td> 3 horas e 45 minutos </td>
					<td> 200,00 </td>
				</tr>
				<!--Criando a quarta linha  -->
				<tr>
					<td>Caminhonete Hilux</td>
					<td> Trocar a bateria </td>
					<td> 30 minutos </td>
					<td> 25,00 </td>
				</tr>
				
				<!--Criando a quinta lilha -->
				<tr>
					<td>Caminhonete D10</td>
					<td> Alinhamento  </td>
					<td>  1 hora e 40 minutos </td>
					<td> 220,00 </td>
				</tr> 			
			</tbody>
		</table>
	</body>
</html>
