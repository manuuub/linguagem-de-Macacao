<!DOCTYPE html>
<html lang = "pt-br">
	<head>
		<meta charset = "UTF-8">
		<title>Cadastro de Usuario</title>
	</head>
	<body>
		<!-- Criar o formulario form - tag de formulario atributo "action" aponta para uma pagina atributo" method" -->
		
		<form action = "#" method= "POST">
			<!--Label - rotulo do campo -->
			<Label>Nome Completo:</label>
			<br>
			<!--INPUT - campo de entrada de dados TYPE - tipo do campo -->
			<input type="text" id= "nome" name = "nome">
			<br><br>
			<input type="submit" value = "Cadastrar">
	</body>
</html>
